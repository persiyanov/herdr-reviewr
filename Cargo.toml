[package]
name = "herdr-reviewr"
version = "0.45.0"
edition = "2024"
rust-version = "1.97"
description = "A terminal review pane for herdr: browse an agent's changes and send comments back to chat."
authors = ["Dmitry Persiyanov <dmitry.persiyanov@gmail.com>"]
license = "MIT"
repository = "https://github.com/persiyanov/herdr-reviewr"
readme = "README.md"
keywords = ["herdr", "tui", "diff", "review", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
dirs = "7"
fff-search = "0.11.0"
# Already in the tree. Names each workspace's action lock file one-to-one.
hex = "0.4"
# The matcher fff-search scores with: the base picker ranks branch names by the same rule
# as the search screen, over a plain string list.
neo_frizbee = "0.13.3"
# Pinned in the lockfile through ratatui's optional `palette` feature. WCAG contrast and OKLab
# for the color roles, instead of hand-rolled matrices.
palette = { version = "0.7.7", default-features = false, features = ["std"] }
# herdr and the forge CLIs run in a process group (unix) or job object (Windows), so ending a
# run ends its whole tree, `az.cmd`'s python included.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.2.0", features = ["text"] }
# Dumps + fancy-regex only: no yaml-load (we read prebuilt binary syntax dumps, so the
# unmaintained yaml-rust never enters the tree), no onig (pure-Rust regex engine).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "plist-load"] }
# The private index copies git refreshes and adds into (`git::IndexCopy`).
tempfile = "3"
# Already in the tree through ratatui's calendar widget. Parses RFC 3339 forge timestamps,
# and writes Gitea's back as UTC.
time = { version = "0.3", features = ["parsing", "formatting"] }
toml = "1.1"
two-face = "0.5.2"
unicode-width = "0.2"
# Program lookup the way a shell does it: the executable bit on unix, PATHEXT on Windows
# (so `az` finds `az.cmd`), and never the current directory for a bare name.
which = "8.0.6"

[target.'cfg(windows)'.dependencies]
# The Win32 clipboard, written as UTF-16 so non-ASCII survives (`clip.exe` mangles it). Text
# only: no image support, so no image codecs enter the tree.
arboard = { version = "3.6.1", default-features = false }
# The console calls behind the Windows input reader (`src/input/windows.rs`): its mode and its
# input records. Already in the tree through crossterm.
crossterm_winapi = "0.9.1"
# herdr's Windows socket is a named pipe; the crate herdr serves it with connects to it, waiting
# for a busy pipe only until the send's deadline. No default features, so no async runtime.
interprocess = "2.4.4"
# Opens a link through `ShellExecuteW` with no shell between, so an `&` in a URL can't
# truncate or inject.
opener = "0.9.0"
# crossterm's unix input parser, published on its own, and its mapping onto crossterm's events:
# the Windows reader parses the console's VT input with them (`src/input/vt.rs`).
terminput = "0.5.15"
terminput-crossterm = "0.4.11"
# `WaitForSingleObject` on the console input handle, the one call no safe wrapper offers. The
# features are already on in the tree.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
# The Windows input parser's tests run on every OS (`src/input/vt.rs`).
terminput = "0.5.15"
terminput-crossterm = "0.4.11"

[lints.rust]
# Deny, not forbid: the Windows input reader allows it for one console wait
# (`src/input/windows.rs`).
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic allows for an application binary (vs a public library):
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"

[profile.release]
strip = true
lto = "thin"
