id = "persiyanov.reviewr"
name = "reviewr"
version = "0.49.0"
# 0.9.3 adds the socket reads the herdr connection relies on (`session.snapshot`, live subscriptions,
# the move events); 0.9.0 resolves pane commands against the plugin root (docs/herdr-api-notes.md).
min_herdr_version = "0.9.3"
platforms = ["macos", "linux", "windows"]
description = "Review agent-written diffs beside the chat and add line comments to the agent input."

# Install downloads this platform's binary from the release into bin/; `plugin link` skips it.
# Windows runs the PowerShell twin, since `bash` there can be WSL's, which would fetch Linux's.
[[build]]
platforms = ["macos", "linux"]
command = ["bash", "herdr/install.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "herdr/install.ps1"]

# Every command runs `bin/herdr-reviewr` itself, the actions and the event hook as `--action <id>`,
# so one id works on every OS with no shell between.
[[panes]]
id = "pane"
title = "reviewr"
placement = "split"
command = ["bin/herdr-reviewr"]

[[actions]]
id = "toggle"
title = "reviewr: toggle pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewr", "--action", "toggle"]

[[actions]]
id = "open"
title = "reviewr: open pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewr", "--action", "open"]

[[actions]]
id = "close"
title = "reviewr: close pane"
contexts = ["pane", "workspace"]
command = ["bin/herdr-reviewr", "--action", "close"]

# Auto-open a reviewr pane when a worktree workspace is born (gated by auto_open; see
# `src/actions.rs`).
[[events]]
on = "worktree.created"
command = ["bin/herdr-reviewr", "--action", "auto-open"]

[[events]]
on = "worktree.opened"
command = ["bin/herdr-reviewr", "--action", "auto-open"]
